services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: jira_mock
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira -d jira_mock"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mock-jira:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://jira:jira_password@postgres:5432/jira_mock
      BASE_URL: http://localhost:8080
      SEED_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/rest/api/2/serverInfo || exit 1"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
